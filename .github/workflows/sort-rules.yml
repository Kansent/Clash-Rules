name: Auto Sort Rule Lists

on:
  schedule:
    - cron: '0 0 * * 1'
    
jobs:
  sort-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run Sort Script
        run: |
          python scripts/sort_rules.py .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: auto-sort rule lists [skip ci]"
          title: "style: auto-sort rule lists [skip ci]"
          body: |
            Auto-sorted rule lists via GitHub Actions.
            Please review the diff before merging.
          branch: auto-sort-rules-patch
          delete-branch: true

name: Build Mihomo Ruleset (.mrs)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rules/**'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Mihomo CLI
        run: |
          MIHOMO_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url" | grep "linux-amd64" | grep -v "compatible" | head -n 1 | cut -d '"' -f 4)
          curl -L $MIHOMO_URL -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo

      - name: Auto Process and Compile Rules
        run: |
          mkdir -p output/tmp
          
          python3 -c '
          import os
          import glob
          import subprocess

          RULES_DIR = "rules"
          OUTPUT_DIR = "output"
          TMP_DIR = "output/tmp"

          if os.path.exists(RULES_DIR):
              for policy in os.listdir(RULES_DIR):
                  policy_path = os.path.join(RULES_DIR, policy)
                  if not os.path.isdir(policy_path):
                      continue

                  # 1. 处理 Domain 类型的规则
                  domain_dir = os.path.join(policy_path, "domain")
                  if os.path.exists(domain_dir):
                      domain_lines = set()
                      files = glob.glob(f"{domain_dir}/**/*.list", recursive=True) + glob.glob(f"{domain_dir}/**/*.txt", recursive=True)
                      for fpath in files:
                          with open(fpath, "r", encoding="utf-8") as f:
                              for line in f:
                                  line = line.strip()
                                  # 过滤空行、注释，以及 MRS Domain 不支持的 keyword: 规则
                                  if not line or line.startswith("#") or line.startswith("keyword:"):
                                      continue
                                  
                                  # 保持原始域名，不强加 full: 前缀
                                  domain_lines.add(line)
                      
                      if domain_lines:
                          tmp_file = os.path.join(TMP_DIR, f"{policy}_domain.txt")
                          yaml_file = os.path.join(OUTPUT_DIR, f"{policy}-domain.yaml")
                          mrs_file = os.path.join(OUTPUT_DIR, f"{policy}-domain.mrs")
                          
                          sorted_domains = sorted(domain_lines)

                          # 写入临时文本供编译
                          with open(tmp_file, "w", encoding="utf-8") as f:
                              f.write("\n".join(sorted_domains))
                          
                          # 生成干净无 full: 的 Mihomo YAML 规则集
                          with open(yaml_file, "w", encoding="utf-8") as f:
                              f.write("payload:\n")
                              for domain in sorted_domains:
                                  f.write(f"  - \x27{domain}\x27\n")
                          
                          # 执行 mihomo 编译为 .mrs
                          print(f"Compiling {mrs_file}...")
                          subprocess.run(["./mihomo", "convert-ruleset", "domain", "text", tmp_file, mrs_file], check=True)

                  # 2. 处理 IP 类型的规则
                  ip_dir = os.path.join(policy_path, "ip")
                  if os.path.exists(ip_dir):
                      ip_lines = set()
                      files = glob.glob(f"{ip_dir}/**/*.list", recursive=True) + glob.glob(f"{ip_dir}/**/*.txt", recursive=True)
                      for fpath in files:
                          with open(fpath, "r", encoding="utf-8") as f:
                              for line in f:
                                  line = line.strip()
                                  if not line or line.startswith("#"):
                                      continue
                                  ip_lines.add(line)
                      
                      if ip_lines:
                          tmp_file = os.path.join(TMP_DIR, f"{policy}_ip.txt")
                          yaml_file = os.path.join(OUTPUT_DIR, f"{policy}-ip.yaml")
                          mrs_file = os.path.join(OUTPUT_DIR, f"{policy}-ip.mrs")
                          
                          sorted_ips = sorted(ip_lines)

                          with open(tmp_file, "w", encoding="utf-8") as f:
                              f.write("\n".join(sorted_ips))

                          with open(yaml_file, "w", encoding="utf-8") as f:
                              f.write("payload:\n")
                              for ip in sorted_ips:
                                  f.write(f"  - \x27{ip}\x27\n")
                          
                          print(f"Compiling {mrs_file}...")
                          subprocess.run(["./mihomo", "convert-ruleset", "ipcidr", "text", tmp_file, mrs_file], check=True)
          '

          rm -rf output/tmp

      - name: Deploy to Release Branch
        run: |
          cd output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "build: auto compile ruleset"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:release
name: Build Mihomo Ruleset (.mrs)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rules/**'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Mihomo CLI
        run: |
          MIHOMO_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url" | grep "linux-amd64" | grep -v "compatible" | head -n 1 | cut -d '"' -f 4)
          curl -L $MIHOMO_URL -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo

      - name: Auto Process and Compile Rules
        run: |
          mkdir -p output/tmp
          
          python3 -c '
          import os
          import glob
          import subprocess

          RULES_DIR = "rules"
          OUTPUT_DIR = "output"
          TMP_DIR = "output/tmp"

          def parse_domain_files(files):
              domains = set()
              for fpath in files:
                  with open(fpath, "r", encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          # 过滤空行、注释以及 keyword:
                          if not line or line.startswith("#") or line.startswith("keyword:"):
                              continue
                          domains.add(line)
              return domains

          def parse_ip_files(files):
              ips = set()
              for fpath in files:
                  with open(fpath, "r", encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith("#"):
                              continue
                          ips.add(line)
              return ips

          def generate_and_compile(name, items, rule_type, output_dir, tmp_dir):
              if not items:
                  return
              sorted_items = sorted(items)
              tmp_file = os.path.join(tmp_dir, f"{name}.txt")
              yaml_file = os.path.join(output_dir, f"{name}.yaml")
              mrs_file = os.path.join(output_dir, f"{name}.mrs")

              with open(tmp_file, "w", encoding="utf-8") as f:
                  f.write("\n".join(sorted_items))

              # 生成原生无引号 YAML
              with open(yaml_file, "w", encoding="utf-8") as f:
                  f.write("payload:\n")
                  for item in sorted_items:
                      f.write(f"  - {item}\n")

              print(f"Compiling {mrs_file}...")
              conv_type = "domain" if rule_type == "domain" else "ipcidr"
              subprocess.run(["./mihomo", "convert-ruleset", conv_type, "text", tmp_file, mrs_file], check=True)

          if os.path.exists(RULES_DIR):
              for policy in os.listdir(RULES_DIR):
                  policy_path = os.path.join(RULES_DIR, policy)
                  if not os.path.isdir(policy_path):
                      continue

                  domain_dir = os.path.join(policy_path, "domain")
                  ip_dir = os.path.join(policy_path, "ip")

                  # 模式 A：如果有分类子文件夹 domain 或 ip
                  if os.path.exists(domain_dir) or os.path.exists(ip_dir):
                      if os.path.exists(domain_dir):
                          files = glob.glob(f"{domain_dir}/**/*.list", recursive=True) + glob.glob(f"{domain_dir}/**/*.txt", recursive=True)
                          domains = parse_domain_files(files)
                          generate_and_compile(f"{policy}-domain", domains, "domain", OUTPUT_DIR, TMP_DIR)

                      if os.path.exists(ip_dir):
                          files = glob.glob(f"{ip_dir}/**/*.list", recursive=True) + glob.glob(f"{ip_dir}/**/*.txt", recursive=True)
                          ips = parse_ip_files(files)
                          generate_and_compile(f"{policy}-ip", ips, "ip", OUTPUT_DIR, TMP_DIR)

                  # 模式 B：没有子文件夹，直接在 rules/reject/ 目录下放 .list 或 .txt（默认全按 Domain 处理）
                  else:
                      files = glob.glob(f"{policy_path}/*.list") + glob.glob(f"{policy_path}/*.txt")
                      domains = parse_domain_files(files)
                      generate_and_compile(f"{policy}-domain", domains, "domain", OUTPUT_DIR, TMP_DIR)
          '

          rm -rf output/tmp

      - name: Deploy to Release Branch
        run: |
          cd output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "build: auto compile ruleset"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:release
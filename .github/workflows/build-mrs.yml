name: Build Mihomo Ruleset (.mrs)

on:
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python & Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install maxminddb requests

      - name: Download GeoIP-ASN Database & Mihomo CLI
        run: |
          # 1. 下载最新 GeoLite2-ASN.mmdb
          echo "Downloading GeoLite2-ASN database..."
          curl -sSL "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb" -o GeoLite2-ASN.mmdb

          # 2. 下载 Mihomo CLI
          MIHOMO_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url" | grep "linux-amd64" | grep -v "compatible" | head -n 1 | cut -d '"' -f 4)
          curl -sSL $MIHOMO_URL -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo

      - name: Auto Process and Compile Rules
        run: |
          mkdir -p output/tmp
          
          python3 -c '
          import os
          import glob
          import subprocess
          import ipaddress
          import maxminddb
          import urllib.request

          RULES_DIR = "rules"
          OUTPUT_DIR = "output"
          TMP_DIR = "output/tmp"
          MMDB_PATH = "GeoLite2-ASN.mmdb"

          # ==================== 在这里配置远程上游地址 ====================
          # 可以为不同的策略指定上游链接列表 (例如 REJECT / AdBlock)
          REMOTE_SOURCES = {
              "REJECT": [
                  "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/pro.txt"
              ]
          }
          # ===============================================================

          def fetch_remote_domains(urls):
              """从在线 URL 下载规则并自动清洗注释和无效行"""
              domains = set()
              for url in urls:
                  print(f"--> [Remote] Fetching remote domains from: {url}")
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          content = response.read().decode("utf-8")
                          for line in content.splitlines():
                              line = line.strip()
                              if not line or line.startswith("#") or line.startswith("!") or line.startswith("keyword:"):
                                  continue
                              domains.add(line)
                  except Exception as e:
                      print(f"--> [Remote Error] Failed to fetch {url}: {e}")
              return domains

          def optimize_cidrs(cidr_list):
              """对 IPv4 和 IPv6 网段分别做 CIDR 重叠与连续网段合并优化"""
              v4_nets = []
              v6_nets = []
              for item in cidr_list:
                  try:
                      net = ipaddress.ip_network(item, strict=False)
                      if net.version == 4:
                          v4_nets.append(net)
                      else:
                          v6_nets.append(net)
                  except Exception:
                      continue
              
              merged_v4 = [str(net) for net in ipaddress.collapse_addresses(v4_nets)]
              merged_v6 = [str(net) for net in ipaddress.collapse_addresses(v6_nets)]
              return merged_v4 + merged_v6

          def get_cidrs_from_asn_mmdb(asn_str):
              """使用 maxminddb 官方库遍历提取极度精确的 CIDR 网段"""
              target_asn = int(asn_str.upper().replace("AS", "").strip())
              print(f"--> [GeoIP MMDB] Querying AS{target_asn} from GeoLite2-ASN.mmdb...")
              
              raw_cidrs = []
              if os.path.exists(MMDB_PATH):
                  try:
                      with maxminddb.open_database(MMDB_PATH) as reader:
                          for network, record in reader:
                              if isinstance(record, dict):
                                  asn = record.get("autonomous_system_number")
                                  if asn == target_asn:
                                      raw_cidrs.append(network)
                  except Exception as e:
                      print(f"--> [GeoIP MMDB] Reading MMDB failed: {e}")
              else:
                  print("--> [GeoIP MMDB] MMDB file not found!")

              optimized = optimize_cidrs(raw_cidrs)
              print(f"--> [GeoIP MMDB] Total {len(optimized)} precise IPv4/IPv6 CIDRs found for AS{target_asn}")
              return optimized

          def parse_domain_files(files):
              domains = set()
              for fpath in files:
                  with open(fpath, "r", encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith("#") or line.startswith("!") or line.startswith("keyword:"):
                              continue
                          domains.add(line)
              return domains

          def parse_ip_files(files):
              ips = set()
              for fpath in files:
                  with open(fpath, "r", encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith("#"):
                              continue
                          if line.upper().startswith("AS") and line[2:].isdigit():
                              fetched = get_cidrs_from_asn_mmdb(line)
                              ips.update(fetched)
                          else:
                              ips.add(line)
              return ips

          def save_yaml(filename, items):
              if not items:
                  return
              sorted_items = sorted(items)
              yaml_file = os.path.join(OUTPUT_DIR, f"{filename}.yaml")
              with open(yaml_file, "w", encoding="utf-8") as f:
                  f.write("payload:\n")
                  for item in sorted_items:
                      f.write(f"  - {item}\n")

          def compile_mrs(filename, items, conv_type):
              if not items:
                  return
              sorted_items = sorted(items)
              tmp_file = os.path.join(TMP_DIR, f"{filename}.txt")
              mrs_file = os.path.join(OUTPUT_DIR, f"{filename}.mrs")

              with open(tmp_file, "w", encoding="utf-8") as f:
                  f.write("\n".join(sorted_items))

              print(f"Compiling {mrs_file} using behavior: {conv_type}...")
              subprocess.run(["./mihomo", "convert-ruleset", conv_type, "text", tmp_file, mrs_file], check=True)

          if os.path.exists(RULES_DIR):
              for policy in os.listdir(RULES_DIR):
                  policy_path = os.path.join(RULES_DIR, policy)
                  if not os.path.isdir(policy_path):
                      continue

                  domain_dir = os.path.join(policy_path, "domain")
                  ip_dir = os.path.join(policy_path, "ip")

                  # 检查当前策略是否有配置的在线远程上游
                  remote_domains = set()
                  if policy in REMOTE_SOURCES:
                      remote_domains = fetch_remote_domains(REMOTE_SOURCES[policy])

                  # 模式 A：存在 domain 或 ip 文件夹
                  if os.path.exists(domain_dir) or os.path.exists(ip_dir):
                      if os.path.exists(domain_dir) or remote_domains:
                          files = glob.glob(f"{domain_dir}/**/*.list", recursive=True) + glob.glob(f"{domain_dir}/**/*.txt", recursive=True) if os.path.exists(domain_dir) else []
                          domains = parse_domain_files(files) | remote_domains
                          if domains:
                              save_yaml(f"{policy}-domain", domains)
                              compile_mrs(f"{policy}-domain", domains, "domain")

                      if os.path.exists(ip_dir):
                          files = glob.glob(f"{ip_dir}/**/*.list", recursive=True) + glob.glob(f"{ip_dir}/**/*.txt", recursive=True)
                          policy_all_ips = parse_ip_files(files)
                          if policy_all_ips:
                              optimized_policy_ips = optimize_cidrs(list(policy_all_ips))
                              save_yaml(f"{policy}-ip", optimized_policy_ips)
                              compile_mrs(f"{policy}-ip", optimized_policy_ips, "ipcidr")

                  # 模式 B：策略根目录下直接放置 .list 文件
                  else:
                      files = glob.glob(f"{policy_path}/*.list") + glob.glob(f"{policy_path}/*.txt")
                      
                      domain_files = [f for f in files if "domain" in os.path.basename(f).lower()]
                      ip_files = [f for f in files if "ip" in os.path.basename(f).lower()]
                      other_files = [f for f in files if f not in domain_files and f not in ip_files]

                      if domain_files or remote_domains:
                          domains = parse_domain_files(domain_files) | remote_domains
                          if domains:
                              save_yaml(f"{policy}-domain", domains)
                              compile_mrs(f"{policy}-domain", domains, "domain")

                      if ip_files:
                          ips = parse_ip_files(ip_files)
                          if ips:
                              optimized_ips = optimize_cidrs(list(ips))
                              save_yaml(f"{policy}-ip", optimized_ips)
                              compile_mrs(f"{policy}-ip", optimized_ips, "ipcidr")

                      if other_files:
                          domains = parse_domain_files(other_files)
                          if domains:
                              save_yaml(f"{policy}-domain", domains)
                              compile_mrs(f"{policy}-domain", domains, "domain")
          '

          rm -rf output/tmp

      - name: Deploy to Meta Branch
        run: |
          cd output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]"
          git add .
          git commit -m "build: auto compile ruleset"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:meta
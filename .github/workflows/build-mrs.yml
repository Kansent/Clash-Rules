name: Build Mihomo Ruleset (.mrs)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rules/**'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GeoIP-ASN Database, Tools & Mihomo CLI
        run: |
          # 1. 下载最新 GeoLite2-ASN.mmdb
          echo "Downloading GeoLite2-ASN database..."
          curl -L "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb" -o GeoLite2-ASN.mmdb

          # 2. 下载 mmdbctl 工具 (用于极速解析 MMDB)
          MMDBCTL_URL=$(curl -s https://api.github.com/repos/ipverse/mmdbctl/releases/latest | grep "browser_download_url" | grep "linux_amd64" | cut -d '"' -f 4)
          curl -L $MMDBCTL_URL -o mmdbctl.tar.gz
          tar -xvf mmdbctl.tar.gz mmdbctl
          chmod +x mmdbctl

          # 3. 下载 Mihomo CLI
          MIHOMO_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url" | grep "linux-amd64" | grep -v "compatible" | head -n 1 | cut -d '"' -f 4)
          curl -L $MIHOMO_URL -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo

      - name: Auto Process and Compile Rules
        run: |
          mkdir -p output/tmp
          
          python3 -c '
          import os
          import glob
          import subprocess
          import ipaddress

          RULES_DIR = "rules"
          OUTPUT_DIR = "output"
          TMP_DIR = "output/tmp"
          MMDB_PATH = "GeoLite2-ASN.mmdb"

          def optimize_cidrs(cidr_list):
              """对 IPv4 和 IPv6 网段分别做 CIDR 重叠与连续网段合并优化"""
              v4_nets = []
              v6_nets = []
              for item in cidr_list:
                  try:
                      net = ipaddress.ip_network(item, strict=False)
                      if net.version == 4:
                          v4_nets.append(net)
                      else:
                          v6_nets.append(net)
                  except Exception:
                      continue
              
              merged_v4 = [str(net) for net in ipaddress.collapse_addresses(v4_nets)]
              merged_v6 = [str(net) for net in ipaddress.collapse_addresses(v6_nets)]
              return merged_v4 + merged_v6

          def get_cidrs_from_asn_mmdb(asn_str):
              """使用 mmdbctl 命令行极速、精准提取对应 ASN 的全部 CIDR"""
              target_asn = asn_str.upper().replace("AS", "").strip()
              print(f"--> [GeoIP MMDB] Querying AS{target_asn} from GeoLite2-ASN.mmdb...")
              
              raw_cidrs = []
              if os.path.exists(MMDB_PATH) and os.path.exists("./mmdbctl"):
                  try:
                      # 使用 mmdbctl read 匹配包含该 ASN 的条目
                      res = subprocess.run(
                          ["./mmdbctl", "read", MMDB_PATH, "-f", f"autonomous_system_number={target_asn}"],
                          capture_output=True,
                          text=True,
                          check=True
                      )
                      # 返回格式类似于 "1.0.0.0/24, AS13335, ..."
                      for line in res.stdout.splitlines():
                          parts = line.split(",")
                          if parts:
                              cidr = parts[0].strip()
                              if "/" in cidr:
                                  raw_cidrs.append(cidr)
                  except Exception as e:
                      print(f"--> [GeoIP MMDB] mmdbctl execution failed: {e}")
              else:
                  print("--> [GeoIP MMDB] MMDB file or mmdbctl tool not found!")

              optimized = optimize_cidrs(raw_cidrs)
              print(f"--> [GeoIP MMDB] Total {len(optimized)} precise IPv4/IPv6 CIDRs found for AS{target_asn}")
              return optimized

          def parse_domain_files(files):
              domains = set()
              for fpath in files:
                  with open(fpath, "r", encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith("#") or line.startswith("keyword:"):
                              continue
                          domains.add(line)
              return domains

          def save_yaml(filename, items):
              if not items:
                  return
              sorted_items = sorted(items)
              yaml_file = os.path.join(OUTPUT_DIR, f"{filename}.yaml")
              with open(yaml_file, "w", encoding="utf-8") as f:
                  f.write("payload:\n")
                  for item in sorted_items:
                      f.write(f"  - {item}\n")

          def compile_mrs(filename, items, conv_type):
              if not items:
                  return
              sorted_items = sorted(items)
              tmp_file = os.path.join(TMP_DIR, f"{filename}.txt")
              mrs_file = os.path.join(OUTPUT_DIR, f"{filename}.mrs")

              with open(tmp_file, "w", encoding="utf-8") as f:
                  f.write("\n".join(sorted_items))

              print(f"Compiling {mrs_file} using behavior: {conv_type}...")
              subprocess.run(["./mihomo", "convert-ruleset", conv_type, "text", tmp_file, mrs_file], check=True)

          if os.path.exists(RULES_DIR):
              for policy in os.listdir(RULES_DIR):
                  policy_path = os.path.join(RULES_DIR, policy)
                  if not os.path.isdir(policy_path):
                      continue

                  domain_dir = os.path.join(policy_path, "domain")
                  ip_dir = os.path.join(policy_path, "ip")

                  # 模式 A：存在分类文件夹
                  if os.path.exists(domain_dir) or os.path.exists(ip_dir):
                      if os.path.exists(domain_dir):
                          files = glob.glob(f"{domain_dir}/**/*.list", recursive=True) + glob.glob(f"{domain_dir}/**/*.txt", recursive=True)
                          domains = parse_domain_files(files)
                          if domains:
                              save_yaml(f"{policy}-domain", domains)
                              compile_mrs(f"{policy}-domain", domains, "domain")

                      if os.path.exists(ip_dir):
                          files = glob.glob(f"{ip_dir}/**/*.list", recursive=True) + glob.glob(f"{ip_dir}/**/*.txt", recursive=True)
                          
                          for fpath in files:
                              fname = os.path.splitext(os.path.basename(fpath))[0]
                              
                              normal_ips = set()
                              asn_ips = set()
                              has_asn = False

                              with open(fpath, "r", encoding="utf-8") as f:
                                  for line in f:
                                      line = line.strip()
                                      if not line or line.startswith("#"):
                                          continue
                                      if line.upper().startswith("AS") and line[2:].isdigit():
                                          has_asn = True
                                          fetched = get_cidrs_from_asn_mmdb(line)
                                          asn_ips.update(fetched)
                                      else:
                                          normal_ips.add(line)

                              # 包含了 ASN 的情况（如 Hoyoverse.list 内写了 AS45102）
                              if has_asn:
                                  # 1. 导出 Hoyoverse-ipcidr.yaml
                                  if asn_ips:
                                      save_yaml(f"{fname}-ipcidr", asn_ips)

                                  # 2. 如果还有普通 IP，导出 Hoyoverse-ip.yaml
                                  if normal_ips:
                                      save_yaml(f"{fname}-ip", normal_ips)

                                  # 3. 将 ASN 网段 + 普通 IP 合并重新做 CIDR 优化后，编译导出 Hoyoverse.mrs
                                  combined_ips = optimize_cidrs(list(asn_ips.union(normal_ips)))
                                  if combined_ips:
                                      compile_mrs(f"{fname}", combined_ips, "ipcidr")

                              # 普通 IP 列表（不含 ASN，如 PROXY/ip/app.list）
                              else:
                                  if normal_ips:
                                      save_yaml(f"{policy}-{fname}", normal_ips)
                                      compile_mrs(f"{policy}-{fname}", normal_ips, "ipcidr")

                  # 模式 B：根目录下直接放 .list (如 rules/REJECT/ads.list)
                  else:
                      files = glob.glob(f"{policy_path}/*.list") + glob.glob(f"{policy_path}/*.txt")
                      domains = parse_domain_files(files)
                      if domains:
                          save_yaml(f"{policy}-domain", domains)
                          compile_mrs(f"{policy}-domain", domains, "domain")
          '

          rm -rf output/tmp

      - name: Deploy to Meta Branch
        run: |
          cd output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]"
          git add .
          git commit -m "build: auto compile ruleset"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:meta
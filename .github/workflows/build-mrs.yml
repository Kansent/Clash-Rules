name: Build Mihomo Ruleset (.mrs)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rules/**'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Mihomo CLI
        run: |
          MIHOMO_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url" | grep "linux-amd64" | grep -v "compatible" | head -n 1 | cut -d '"' -f 4)
          curl -L $MIHOMO_URL -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo

      - name: Auto Process and Compile Rules
        run: |
          mkdir -p output/tmp
          
          python3 -c '
          import os
          import glob
          import subprocess
          import urllib.request
          import re

          RULES_DIR = "rules"
          OUTPUT_DIR = "output"
          TMP_DIR = "output/tmp"

          def get_cidrs_from_asn(asn_str):
              asn = asn_str.upper().replace("AS", "").strip()
              print(f"--> [ASN Parser] Fetching CIDRs for ASN: {asn}...")
              cidrs = []
              
              # 1. 优先从 ipverse 抓取
              url_ipverse = f"https://raw.githubusercontent.com/ipverse/asn-ip/master/as/{asn}/ipv4-aggregated.cidr"
              try:
                  req = urllib.request.Request(url_ipverse, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req) as response:
                      lines = response.read().decode("utf-8").splitlines()
                      for line in lines:
                          line = line.strip()
                          if line and not line.startswith("#"):
                              cidrs.append(line)
              except Exception as e:
                  print(f"--> [ASN Parser] ipverse failed for AS{asn}, trying bgp.tools...")

              # 2. 如果 ipverse 失败或为空（如 AS45102），降级从 bgp.tools 抓取
              if not cidrs:
                  url_bgptools = f"https://bgp.tools/as/{asn}/ipv4.txt"
                  try:
                      req = urllib.request.Request(url_bgptools, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})
                      with urllib.request.urlopen(req) as response:
                          lines = response.read().decode("utf-8").splitlines()
                          for line in lines:
                              line = line.strip()
                              # 匹配标准 CIDR 格式
                              if line and not line.startswith("#") and "/" in line:
                                  cidrs.append(line)
                  except Exception as e:
                      print(f"--> [ASN Parser] Error fetching AS{asn} from bgp.tools: {e}")

              print(f"--> [ASN Parser] Total {len(cidrs)} CIDRs found for AS{asn}")
              return cidrs

          def parse_domain_files(files):
              domains = set()
              for fpath in files:
                  with open(fpath, "r", encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith("#") or line.startswith("keyword:"):
                              continue
                          domains.add(line)
              return domains

          def save_yaml(filename, items):
              if not items:
                  return
              sorted_items = sorted(items)
              yaml_file = os.path.join(OUTPUT_DIR, f"{filename}.yaml")
              with open(yaml_file, "w", encoding="utf-8") as f:
                  f.write("payload:\n")
                  for item in sorted_items:
                      f.write(f"  - {item}\n")

          def compile_mrs(filename, items, conv_type):
              if not items:
                  return
              sorted_items = sorted(items)
              tmp_file = os.path.join(TMP_DIR, f"{filename}.txt")
              mrs_file = os.path.join(OUTPUT_DIR, f"{filename}.mrs")

              with open(tmp_file, "w", encoding="utf-8") as f:
                  f.write("\n".join(sorted_items))

              print(f"Compiling {mrs_file} using behavior: {conv_type}...")
              subprocess.run(["./mihomo", "convert-ruleset", conv_type, "text", tmp_file, mrs_file], check=True)

          if os.path.exists(RULES_DIR):
              for policy in os.listdir(RULES_DIR):
                  policy_path = os.path.join(RULES_DIR, policy)
                  if not os.path.isdir(policy_path):
                      continue

                  domain_dir = os.path.join(policy_path, "domain")
                  ip_dir = os.path.join(policy_path, "ip")

                  # 模式 A：存在分类文件夹
                  if os.path.exists(domain_dir) or os.path.exists(ip_dir):
                      if os.path.exists(domain_dir):
                          files = glob.glob(f"{domain_dir}/**/*.list", recursive=True) + glob.glob(f"{domain_dir}/**/*.txt", recursive=True)
                          domains = parse_domain_files(files)
                          if domains:
                              save_yaml(f"{policy}-domain", domains)
                              compile_mrs(f"{policy}-domain", domains, "domain")

                      if os.path.exists(ip_dir):
                          files = glob.glob(f"{ip_dir}/**/*.list", recursive=True) + glob.glob(f"{ip_dir}/**/*.txt", recursive=True)
                          
                          for fpath in files:
                              fname = os.path.splitext(os.path.basename(fpath))[0]
                              
                              normal_ips = set()
                              asn_ips = set()
                              has_asn = False

                              with open(fpath, "r", encoding="utf-8") as f:
                                  for line in f:
                                      line = line.strip()
                                      if not line or line.startswith("#"):
                                          continue
                                      if line.upper().startswith("AS") and line[2:].isdigit():
                                          has_asn = True
                                          fetched = get_cidrs_from_asn(line)
                                          asn_ips.update(fetched)
                                      else:
                                          normal_ips.add(line)

                              # 包含了 ASN 的情况（如 Hoyoverse.list 内写了 AS45102）
                              if has_asn:
                                  # 1. 导出 Hoyoverse-ipcidr.yaml
                                  if asn_ips:
                                      save_yaml(f"{fname}-ipcidr", asn_ips)

                                  # 2. 如果还有普通 IP，导出 Hoyoverse-ip.yaml
                                  if normal_ips:
                                      save_yaml(f"{fname}-ip", normal_ips)

                                  # 3. 将 ASN 网段 + 普通 IP 合并编译导出 Hoyoverse.mrs
                                  combined_ips = asn_ips.union(normal_ips)
                                  if combined_ips:
                                      compile_mrs(f"{fname}", combined_ips, "ipcidr")

                              # 普通 IP 列表（不含 ASN，如 PROXY/ip/app.list）
                              else:
                                  if normal_ips:
                                      save_yaml(f"{policy}-{fname}", normal_ips)
                                      compile_mrs(f"{policy}-{fname}", normal_ips, "ipcidr")

                  # 模式 B：根目录下直接放 .list (如 rules/REJECT/ads.list)
                  else:
                      files = glob.glob(f"{policy_path}/*.list") + glob.glob(f"{policy_path}/*.txt")
                      domains = parse_domain_files(files)
                      if domains:
                          save_yaml(f"{policy}-domain", domains)
                          compile_mrs(f"{policy}-domain", domains, "domain")
          '

          rm -rf output/tmp

      - name: Deploy to Meta Branch
        run: |
          cd output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "build: auto compile ruleset"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:meta
name: Update PCDN Domain List

on:
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: rule-lists-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch and Process Rules
        run: |
          mkdir -p rules/REJECT/domain/

          curl -fsSL https://ruleset.skk.moe/Clash/non_ip/reject-no-drop.txt | awk -F',' '
            { gsub(/\r$/, "") }
            /^#/ || /^[[:space:]]*$/ { next }
            /by\.5ukk4w\.skk\.moe/ { next }
            {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
            }
            $1 == "DOMAIN" && $2 != "" { print $2 }
            $1 == "DOMAIN-SUFFIX" && $2 != "" { print "+." $2 }
          ' > rules/REJECT/domain/PCDN.list

          python3 -c '
          from pathlib import Path
          from scripts.sort_rules import sort_list_file_content

          target = Path("rules/REJECT/domain/PCDN.list")
          raw = target.read_text(encoding="utf-8")
          sorted_text = sort_list_file_content(raw, bottom_category_name="Unknown")
          target.write_text(sorted_text, encoding="utf-8", newline="\n")
          '

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update PCDN.list domain rules"
          title: "chore: 自动更新 PCDN.list 域名规则"
          body: |
            自动化 Workflow 从 https://ruleset.skk.moe/Clash/non_ip/reject-no-drop.txt 提取并转换了最新的 PCDN 域名列表，并按 `sort_rules.py` 规则完成排序。

            - 剔除了 `#` 开头的注释与空行
            - 过滤了 `by.5ukk4w.skk.moe`
            - 转换 `DOMAIN` -> `domain`、`DOMAIN-SUFFIX` -> `+.domain`
            - 按反转域名段升序统一排序
          branch: update-pcdn-list
          base: main
          delete-branch: true
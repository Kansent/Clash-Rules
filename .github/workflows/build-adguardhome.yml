name: Build AdGuard Home Rules

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rules/[rR][eE][jJ][eE][cC][tT]/**'
      - '.github/workflows/build-adguardhome.yml'
  # 定时触发：每周一 UTC 00:00（北京时间 08:00）自动抓取上游更新并构建
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert Reject Domain Rules to AdGuard Home Format
        run: |
          mkdir -p agh_output
          
          python3 -c '
          import os
          import glob
          import urllib.request
          import ipaddress

          RULES_DIR = "rules"
          OUTPUT_FILE = "agh_output/reject.txt"
          
          # 需要合并的上游列表 URL
          UPSTREAM_URLS = [
              "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/httpdns.list",
              "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.list"
          ]

          agh_rules = set()

          def process_raw_line(line):
              line = line.strip()
              # 过滤空行、注释以及 keyword 指令
              if not line or line.startswith("#") or line.startswith("keyword:"):
                  return

              # 跳过 AS 开头的 ASN 标记行（AGH 不支持 ASN 规则）
              if line.upper().startswith("AS") and line[2:].isdigit():
                  return

              # 剥离常用的前缀 (如 +. 或 full:)
              if line.startswith("+."):
                  rule_target = line[2:]
              elif line.startswith("full:"):
                  rule_target = line[5:]
              else:
                  rule_target = line

              rule_target = rule_target.strip()
              if not rule_target:
                  return

              # 判断是否为 IP 或 CIDR 网段
              is_ip = False
              try:
                  ipaddress.ip_network(rule_target, strict=False)
                  is_ip = True
              except ValueError:
                  is_ip = False

              if is_ip:
                  # AGH 拦截 IP/CIDR 时直接写地址，不加 || 和 ^
                  agh_rules.add(rule_target)
              else:
                  # AGH 拦截域名时使用 standard 语法 ||domain^
                  agh_rules.add(f"||{rule_target}^")

          def fetch_and_process_url(url):
              print(f"--> [Remote Upstream] Fetching from {url}...")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      content = resp.read().decode("utf-8", errors="ignore")
                      for line in content.splitlines():
                          process_raw_line(line)
              except Exception as e:
                  print(f"--> [Remote Upstream] Error fetching {url}: {e}")

          # 1. 解析上游指定的所有远程规则列表
          for upstream in UPSTREAM_URLS:
              fetch_and_process_url(upstream)

          # 2. 本地 rules/REJECT 下的所有文件解析
          if os.path.exists(RULES_DIR):
              for d in os.listdir(RULES_DIR):
                  if d.lower() == "reject":
                      target_dir = os.path.join(RULES_DIR, d)
                      files = glob.glob(f"{target_dir}/**/*.list", recursive=True) + glob.glob(f"{target_dir}/**/*.txt", recursive=True)
                      
                      for fpath in files:
                          with open(fpath, "r", encoding="utf-8") as f:
                              for line in f:
                                  process_raw_line(line)

          # 3. 输出为包含上游 + 本地合并后的 AdGuard Home 格式文件
          if agh_rules:
              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("! Title: Reject Rules for AdGuard Home\n")
                  f.write("! Homepage: https://github.com/" + os.getenv("GITHUB_REPOSITORY", "") + "\n")
                  f.write("! Total Count: " + str(len(agh_rules)) + "\n\n")
                  f.write("\n".join(sorted(agh_rules)))
                  f.write("\n")
              print(f"Successfully generated {len(agh_rules)} rules to {OUTPUT_FILE}")
          else:
              print("No valid reject rules found!")
          '

      - name: Deploy to AdGuard Home Branch
        run: |
          if [ -f "agh_output/reject.txt" ]; then
            cd agh_output
            git init
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "build: auto generate adguardhome reject rules"
            git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:adguardhome
          else
            echo "No reject file found, skip deployment."
          fi